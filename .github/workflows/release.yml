name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SDKDIR: /builder
  REPO_NAME: luci-app-nginx-manager
  PKG_NAME: luci-app-nginx-manager

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: check
        run: |
          PKG_VERSION=$(grep '^PKG_VERSION:=' Makefile | cut -d= -f2)
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' Makefile | cut -d= -f2)
          TAG="v${PKG_VERSION}-${PKG_RELEASE}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger, proceeding with build"
            {
              echo "changed=true"
              echo "version=${PKG_VERSION}"
              echo "release=${PKG_RELEASE}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag -l "$TAG" | grep -q .; then
            echo "Tag ${TAG} already exists, skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New version detected: ${TAG}"
          {
            echo "changed=true"
            echo "version=${PKG_VERSION}"
            echo "release=${PKG_RELEASE}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: "v24.10.5"
            pkgtype: ipk
            arch: x86_64
          - branch: "v25.12.0"
            pkgtype: apk
            arch: x86_64
    name: "Build ${{ matrix.pkgtype }} (${{ matrix.branch }})"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}
      options: --user root
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ${{ env.REPO_NAME }}

      - name: Fix SDK paths
        run: |
          mkdir -p "$SDKDIR/shared-workdir"
          rm -rf "$SDKDIR/shared-workdir/build"
          ln -sf "$SDKDIR" "$SDKDIR/shared-workdir/build"

      - name: Cache SDK build
        uses: HiGarfield/cachewrtbuild@3c396d6d42253c392a1c7c2ca996869c3d5b5853 # main @ 2026-11-05
        with:
          mixkey: ${{ matrix.branch }}
          prefix: ${{ env.SDKDIR }}

      - name: Cache feeds
        id: cache-feeds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.SDKDIR }}/feeds
          key: feeds-${{ matrix.branch }}-${{ hashFiles('feeds.conf') }}
          restore-keys: |
            feeds-${{ matrix.branch }}-

      - name: Update and install feeds
        working-directory: ${{ env.SDKDIR }}
        run: |
          if [ "${{ steps.cache-feeds.outputs.cache-hit }}" != "true" ]; then
            ./scripts/feeds update base packages luci
          fi
          ./scripts/feeds install luci-base nginx-ssl rpcd rpcd-mod-file openssl-util acme acme-acmesh-dnsapi diffutils flock

      - name: Prepare package source
        working-directory: ${{ env.SDKDIR }}
        run: |
          rm -rf "./package/$PKG_NAME"
          mkdir -p "./package/$PKG_NAME"
          cp -a "$GITHUB_WORKSPACE/$REPO_NAME/." "./package/$PKG_NAME/"

      - name: Configure
        working-directory: ${{ env.SDKDIR }}
        run: |
          echo "CONFIG_PACKAGE_${PKG_NAME}=y" >> .config
          make defconfig

      - name: Build package
        working-directory: ${{ env.SDKDIR }}
        run: |
          set -euo pipefail
          target="package/$PKG_NAME/compile"
          jobs="$(($(nproc)+1))"
          if make -j"$jobs" "$target"; then
            exit 0
          else
            fast_rc=$?
          fi
          echo "::error::Fast parallel OpenWrt build failed: $target"
          echo "::group::OpenWrt config at fast-build failure"
          if [ -f .config ]; then cat .config; fi
          echo "::endgroup::"
          echo "::group::Serial verbose diagnostic: $target"
          if make -j1 "$target" V=s; then
            diagnostic_rc=0
          else
            diagnostic_rc=$?
          fi
          echo "Serial diagnostic exit code: $diagnostic_rc"
          echo "::endgroup::"
          exit "$fast_rc"

      - name: Collect package
        working-directory: ${{ env.SDKDIR }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          package_files="$(find ./bin/ -type f -name "${PKG_NAME}*.${{ matrix.pkgtype }}")"
          if [ -z "$package_files" ]; then
            echo "::error::No ${PKG_NAME} .${{ matrix.pkgtype }} package was produced"
            find ./bin/ -type f -name "*.${{ matrix.pkgtype }}" -print
            exit 1
          fi
          printf '%s\n' "$package_files" | while IFS= read -r file; do
            cp "$file" "$GITHUB_WORKSPACE/output/"
          done
          ls -la "$GITHUB_WORKSPACE/output/"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # main @ 2026-11-05
        with:
          name: ${{ matrix.pkgtype }}
          path: output/

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # main @ 2026-11-05
        with:
          path: release/

      - name: List artifacts
        run: |
          find release/ -type f -ls

      - name: Generate checksums
        working-directory: release
        run: |
          find . -type f \( -name '*.ipk' -o -name '*.apk' \) -exec sha256sum {} + > sha256sums.txt
          cat sha256sums.txt

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.check-version.outputs.version }}-${{ needs.check-version.outputs.release }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}-${{ needs.check-version.outputs.release }}
          name: v${{ needs.check-version.outputs.version }}-${{ needs.check-version.outputs.release }}
          body: |
            luci-app-nginx-manager v${{ needs.check-version.outputs.version }}-${{ needs.check-version.outputs.release }}

            Main package: `luci-app-nginx-manager` (LuCI web interface for Nginx management, includes Chinese translation)

            Both `.ipk` (opkg) and `.apk` (apk) formats are provided.

            ## Installation (opkg - OpenWrt 23.05 / 24.10)
            ```bash
            opkg install luci-app-nginx-manager_*.ipk
            ```

            ## Installation (apk - OpenWrt 25.12+)
            ```bash
            apk add --allow-untrusted ./luci-app-nginx-manager*.apk
            ```

            ## Upgrade
            ```bash
            # Download new packages from Release, then install the same way as above.
            # opkg/apk will automatically detect and upgrade the existing version.
            # Your UCI config (/etc/config/nginx_manager) is preserved.

            # Clear LuCI cache after upgrade:
            rm -rf /tmp/luci-*
            # Then force-refresh browser: Ctrl+Shift+R
            ```

            ## Requirements
            - OpenWrt 23.05+
            - nginx-ssl, rpcd, rpcd-mod-file, openssl-util, acme, acme-acmesh-dnsapi, diffutils, flock installed
          files: |
            release/ipk/*.ipk
            release/apk/*.apk
            release/sha256sums.txt
